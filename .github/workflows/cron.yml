name: Flight Scraper & AI Analysis Workflow

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f project/requirements.txt ]; then pip install -r project/requirements.txt; fi

      - name: Run flight scraper
        working-directory: ./project
        run: |
          python main.py

      - name: Run AI Analysis & Generate Charts
        working-directory: ./project
        run: |
          python analysis.py

      - name: Commit and push changes automatically
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action AI"
          git add project/flights.db || true
          git add project/*.png || true
          git add project/*.txt || true
          git commit -m "🤖 AI Auto-Update: Data, Trend Charts and Reports [skip ci]" -a || true
          git push
