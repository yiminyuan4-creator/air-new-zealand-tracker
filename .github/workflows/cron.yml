name: Flight Tracker Suite

on:
  schedule:
    - cron: '0 2 * * *'
  
  workflow_dispatch:
    inputs:
      departure_date:
        description: 'Target departure date (Format: YYYY-MM-DD)'
        required: true
        default: '2026-06-15'
      dep_code:
        description: 'Origin airport IATA code (e.g., AKL)'
        required: true
        default: 'AKL'
      arr_code:
        description: 'Destination airport IATA code (e.g., PVG)'
        required: true
        default: 'PVG'

jobs:
  execute-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 matplotlib==3.8.4 requests==2.31.0 beautifulsoup4==4.12.3

      - name: Run Full-Scale Data Scraper
        if: github.event_name == 'schedule' || github.event.inputs.departure_date == ''
        run: |
          TARGET_MAIN="main.py"
          if [ -f "project/main.py" ]; then TARGET_MAIN="project/main.py"; fi
          python $TARGET_MAIN

      - name: Run Analytics Engine From Database
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.departure_date != ''
        env:
          INPUT_DATE: ${{ github.event.inputs.departure_date }}
          INPUT_DEP: ${{ github.event.inputs.dep_code }}
          INPUT_ARR: ${{ github.event.inputs.arr_code }}
        run: |
          TARGET_SCRIPT="analysis.py"
          if [ -f "project/analysis.py" ]; then TARGET_SCRIPT="project/analysis.py"; fi
          python $TARGET_SCRIPT --date "$INPUT_DATE" --dep "$INPUT_DEP" --arr "$INPUT_ARR"

      - name: Save Infrastructure and Visual Assets
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action Bot"
          
          git add *.db project/*.db 2>/dev/null || true
          git add *.png project/*.png 2>/dev/null || true
          git add *.txt project/*.txt 2>/dev/null || true
          
          git commit -m "build: infrastructure state preservation [skip ci]" -a || true
          git push
