name: Daily Flight Scraper

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'flights.db'
      - 'debug_*.html'
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: Future departure days to scrape
        required: false
        default: '365'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-chromedriver: true
      
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v
      
      - name: Run scraper
        run: python scraper.py --days "${{ inputs.days || '365' }}"
        env:
          CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
          REQUEST_DELAY_MIN: '1'
          REQUEST_DELAY_MAX: '3'
      
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f flights.db
          git diff --cached --quiet || git commit -m "chore: Update flight data - $(date +'%Y-%m-%d %H:%M:%S UTC')"
          git push
