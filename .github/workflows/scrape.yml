name: Daily Flight Scraper

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: Future departure days to scrape
        required: false
        default: '30'
      start_days_ahead:
        description: First departure day offset from today
        required: false
        default: '3'
      max_searches:
        description: Maximum route/date searches this run
        required: false
        default: '50'

permissions:
  contents: write

concurrency:
  group: daily-flight-scraper
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-chromedriver: true
      
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v
      
      - name: Run scraper
        timeout-minutes: 180
        run: python src/scraper.py --days "${{ inputs.days || '30' }}" --start-days-ahead "${{ inputs.start_days_ahead || '3' }}" --max-searches "${{ inputs.max_searches || '50' }}"
        env:
          CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
          TIMEOUT: '25'
          RETRIES: '2'
          REQUEST_DELAY_MIN: '2'
          REQUEST_DELAY_MAX: '5'
      
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f flights.db
          git diff --cached --quiet || git commit -m "chore: Update flight data - $(date +'%Y-%m-%d %H:%M:%S UTC')"
          git push
